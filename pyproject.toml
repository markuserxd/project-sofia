[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sofia"
version = "0.1.0"
description = "A Windows-first AI desktop assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sofia = "sofia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
