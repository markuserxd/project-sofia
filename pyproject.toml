[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sofia"
version = "0.1.0"
description = "A Windows-first AI desktop assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]
openai = ["openai>=2.54,<3", "httpx>=0.28,<1"]
anthropic = ["anthropic>=2.6,<2.7", "httpx2>=2.16,<2.17"]
desktop = ["pywinauto==0.6.9; sys_platform == 'win32'", "pywin32>=311; sys_platform == 'win32'"]
browser = ["playwright>=1.64.1,<1.65"]
ui = ["PySide6>=6.10.2,<6.11"]
stt = ["faster-whisper>=1.2.1,<2", "numpy>=2,<3", "scipy>=1.15,<2"]

[project.scripts]
sofia = "sofia.cli:main"
sofia-gui = "sofia.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser_integration: opt-in real Chromium against the trusted loopback fixture",
    "speech_model: opt-in installed local model and consented local samples",
    "microphone: opt-in real Windows microphone capture",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/sofia"]
check_untyped_defs = true
warn_unused_configs = true
