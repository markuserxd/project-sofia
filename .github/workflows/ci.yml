name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: python -m pip install -e ".[dev,ui,stt,browser,openai,anthropic]"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy src/sofia

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      - name: Explicitly install Chromium for Windows fixture integration
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Run isolated Chromium fixture integration
        if: runner.os == 'Windows'
        env:
          SOFIA_BROWSER_INTEGRATION: "1"
        run: python -m pytest tests/test_browser_integration.py -v

      - name: Run offline workspace example
        run: python examples/workspace_files.py

      - name: Check CLI
        run: |
          python -c "import sofia"
          python -m sofia --help
          python -m sofia --version
          python -m sofia
